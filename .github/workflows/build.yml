name: Build APK

on:
  workflow_dispatch: {}
  push:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK (manual cmdline-tools, no third-party action)
        run: |
          set -e
          ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSL -o cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install SDK components (platform, build-tools, NDK, CMake)
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125

      - name: Build release APK (unsigned if no keystore configured)
        run: gradle assembleRelease --no-daemon --stacktrace
        continue-on-error: true
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125

      - name: Locate APKs
        id: find_apks
        run: |
          echo "Looking for built APKs..."
          find . -name "*.apk" -path "*/outputs/*" -print
          DEBUG_APK=$(find . -name "app-debug.apk" -path "*/outputs/*" | head -n1)
          if [ -z "$DEBUG_APK" ]; then
            echo "::error::app-debug.apk not found -- build did not produce the expected artifact"
            exit 1
          fi
          echo "debug_apk=$DEBUG_APK" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ steps.find_apks.outputs.debug_apk }}
          if-no-files-found: error

      - name: Upload release APK (if built)
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
